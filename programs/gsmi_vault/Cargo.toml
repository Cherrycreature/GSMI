[package]
name = "gsmi_vault"
version = "0.1.0"
description = "GameStop Memecoin Index ($GSMI) - Multi-asset vault for Solana GME memecoins"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "gsmi_vault"

[features]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
cpi = ["no-entrypoint"]
default = []
local-mints = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]
init-if-needed = []

[dependencies]
anchor-lang = { version = "1.1.2", features = ["init-if-needed"] }
anchor-spl = "1.1.2"
